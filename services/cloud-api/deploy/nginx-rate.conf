limit_req_zone $http_cf_connecting_ip zone=midnightcord_cloud:10m rate=30r/m;

# Empty rate-limit keys are not counted. Preflights still reach the API, which
# validates their Origin and requested headers before allowing browser access.
map $http_cf_connecting_ip $midnightcord_gif_client_ip {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}
map $request_method $midnightcord_gif_rate_key {
    default $midnightcord_gif_client_ip;
    OPTIONS "";
}
# Use a new zone name when changing the key: existing workers can then reload.
limit_req_zone $midnightcord_gif_rate_key zone=midnightcord_gif_teams_v2:10m rate=2r/s;

# Match server.mjs's exact website/Discord allowlist, never arbitrary origins.
map $http_origin $midnightcord_gif_cors_origin {
    default "";
    "https://midnightcord.fr" $http_origin;
    "https://www.midnightcord.fr" $http_origin;
    ~*^https://(?:(?:canary|ptb)\.)?discord(?:app)?\.com$ $http_origin;
}
map $midnightcord_gif_cors_origin $midnightcord_gif_cors_expose {
    default "Retry-After";
    "" "";
}
