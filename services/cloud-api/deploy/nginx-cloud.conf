location = /v1/cloud/health {
    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

location = /v1/community/callback {
    access_log off;
    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 35s;
    proxy_send_timeout 15s;
}

location ^~ /v1/community/ {
    access_log off;
    limit_req zone=midnightcord_cloud burst=10 nodelay;

    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location ^~ /v1/cloud/gif-teams {
    limit_req zone=midnightcord_gif_teams_v2 burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @midnightcord_gif_rate_limited;
    client_max_body_size 2100k;

    proxy_pass http://127.0.0.1:4175;
    # Preserve the API's own 429 body and Retry-After; only edge rejections use
    # the named location below.
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location @midnightcord_gif_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Access-Control-Allow-Origin $midnightcord_gif_cors_origin always;
    add_header Access-Control-Expose-Headers $midnightcord_gif_cors_expose always;
    add_header Vary "Origin" always;
    add_header Retry-After "1" always;
    return 429 '{"error":"rate_limited","message":"Too many requests. Try again shortly."}';
}

location ^~ /v1/cloud/ {
    limit_req zone=midnightcord_cloud burst=20 nodelay;
    client_max_body_size 2100k;

    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
