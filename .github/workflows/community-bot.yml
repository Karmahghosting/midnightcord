name: Community bot service

on:
  push:
    branches: [main]
    paths: ["services/community-bot/**", ".github/workflows/community-bot.yml"]
  pull_request:
    paths: ["services/community-bot/**", ".github/workflows/community-bot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/community-bot/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
        working-directory: services/community-bot
      - run: node --check bot.mjs && pnpm test
        working-directory: services/community-bot
