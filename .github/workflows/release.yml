name: Build and release Midnightcord

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_COLOR: true

jobs:
  native:
    name: Native ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Spotify playback synchronization
        run: pnpm test:spotify

      - name: Verify native Shop and Midnightcord AI entry points
        run: pnpm test:midnightcord-ai

      - name: Build native archive
        run: pnpm package:native

      - name: Verify privacy and native injection
        run: pnpm test:privacy && pnpm test:native-injection

      - name: Test graphical installer operations
        run: pnpm test:installer

      - name: Install local Electron for the UI smoke test
        run: node node_modules/electron/install.js

      - name: Prepare Linux Electron smoke environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          electron_sandbox="$(node -p 'require("path").join(require("path").dirname(require("electron")), "chrome-sandbox")')"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"

      - name: Verify installer UI and sandbox on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:installer-electron

      - name: Verify installer UI and sandbox on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:installer-electron

      - name: Build graphical installer
        run: node scripts/packageInstaller.mjs

      - name: Upload graphical installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/installer/*
          if-no-files-found: error

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/native/*
          if-no-files-found: error

  linux-injector:
    name: Linux injector packages
    uses: ./.github/workflows/linux-packages.yml

  update-payload:
    name: Native update payload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test encrypted Cloud protocol
        run: pnpm test:cloud

      - name: Build update payload
        run: pnpm package:update

      - name: Verify privacy
        run: pnpm test:privacy

      - name: Upload update payload
        uses: actions/upload-artifact@v7
        with:
          name: native-update-payload
          path: release/update/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - native
      - linux-injector
      - update-payload
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
